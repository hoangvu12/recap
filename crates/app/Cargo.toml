[package]
name = "recap"
description = "Recap: live captions and meeting notes on Windows (zgx host + Luau UI)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "recap"
path = "src/main.rs"

[dependencies]
recap-engine.workspace = true
tokio.workspace = true
serde_json.workspace = true
zgx.workspace = true
zgx-desktop.workspace = true
# `inspect`: devtools for `zgx inspect`, asked for with `--inspect`.
zgx-script = { workspace = true, features = ["inspect"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
