[package]
name = "recap-engine"
description = "Recap's headless meeting engine: audio and provider seams in, events and a MeetingResult out."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Audio in: WAV files (tests, replays) and resampling to 16 kHz.
hound = "3.5.1"
rubato = "5.1.0"
audioadapter-buffers = "5.1"
# The recording: Ogg/Opus. `opus` builds the bundled libopus with CMake (the
# one in VS Build Tools' "C++ CMake tools" is found automatically). ADR 0003.
opus = "0.4.0"
ogg = "0.9.2"

[target.'cfg(windows)'.dependencies]
# Live capture: the mic and process loopback. `windows` stays on wasapi's 0.62.
wasapi = "0.27.0"
# Processes (ToolHelp) name a meeting app's process and the mic's users.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_ToolHelp",
] }
# The ConsentStore says which apps hold the mic.
winreg = "0.56.0"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
