[package]
name = "recap-providers"
description = "Recap's providers: the registry of provider kinds and presets, the main/backup choice per job, keys in Credential Manager."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
recap-engine.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# AI providers over HTTP (OpenAI-compatible, Anthropic); shared with the
# speech engines.
reqwest.workspace = true
# A `cli` provider runs from an empty temp folder.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# API keys live in Windows Credential Manager, never in files (ADR 0005).
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }
